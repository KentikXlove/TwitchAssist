<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Чат TwitchAssist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2e;
            margin-bottom: 10px;
        }
        .chat-header h3 {
            color: #adadb8;
            font-weight: 400;
            font-size: 16px;
        }
        .chat-header span {
            color: #9147ff;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            background: #0e0e10;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 14px;
            border: 1px solid #2a2a2e;
        }
        .empty-chat {
            color: #5a5a66;
            text-align: center;
            margin-top: 30px;
            font-style: italic;
        }
        .chat-message {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 6px 0;
            border-bottom: 1px solid #1f1f23;
        }
        .chat-message:last-child {
            border-bottom: none;
        }
        .chat-time {
            font-size: 11px;
            color: #5a5a66;
            flex-shrink: 0;
        }
        .chat-username {
            font-weight: 600;
            flex-shrink: 0;
        }
        .chat-text {
            word-break: break-word;
            color: #efeff1;
        }
        .emote {
            display: inline-block;
            vertical-align: middle;
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="chat-header">
        <h3>Чат <span id="channelDisplay">{{ channel }}</span>
        {% if filter_user %}
            <span style="color:#9147ff; font-weight:600; margin-left:10px;">(фильтр: {{ filter_user }})</span>
        {% endif %}
        </h3>
        <span style="font-size:12px; color:#5a5a66;">в реальном времени</span>
    </div>
    <div id="chat-box">
        <div class="empty-chat">Сообщения появятся здесь...</div>
    </div>

    <script>
        // Безопасно передаём значение даже если filter_user = None
        window.FILTER_USER = {{ filter_user|default('')|tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/chat_only.js') }}"></script>
</body>
</html>
